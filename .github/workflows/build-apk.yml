# Gera o APK do app (aplicativo/app) e publica como Release para download.
# Roda a cada push no main que mexa no app, ou manualmente em Actions > Build APK > Run workflow.
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'aplicativo/app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: aplicativo/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicativo/app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # O runner ubuntu-latest já traz o Android SDK (ANDROID_HOME); o Gradle baixa
      # sozinho a plataforma/build-tools que faltarem.
      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Gerar projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK (release, assinado com a chave de debug)
        working-directory: aplicativo/app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../../armazem-ocorrencias.apk

      - uses: actions/upload-artifact@v4
        with:
          name: armazem-ocorrencias-apk
          path: armazem-ocorrencias.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Armazém — APK build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: armazem-ocorrencias.apk
          body: |
            APK do app **Armazém — Controle e Registro de Ocorrências** (Android).

            Baixe `armazem-ocorrencias.apk`, abra no celular e permita "instalar apps desconhecidos".
            Commit: ${{ github.sha }}
